name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version: ["3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the frozen dependency set
        run: uv sync --frozen --all-groups

      - name: Run the deterministic test suite
        run: uv run --frozen pytest

      - name: Build the wheel
        run: uv build --wheel

      - name: Validate the release gate
        run: uv run --frozen python -m rob2_kit.release_gate

      - name: Qualify the frozen wheel through installed entry points
        run: uv run --frozen python scripts/release_qualification.py --wheel dist --receipt release-qualification.json --skip-full-suite --replay-only

      - name: Upload platform qualification receipt
        uses: actions/upload-artifact@v4
        with:
          name: release-qualification-${{ matrix.os }}
          path: release-qualification.json

  verify-release-pin:
    name: Verify committed release pin matches current source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the frozen dependency set
        run: uv sync --frozen --all-groups

      - name: Rebuild the pinned release artifacts from current source
        run: uv run --frozen python scripts/build_release.py

      - name: Fail if the committed release pin is stale relative to src/
        run: |
          if ! git diff --exit-code -- release/wheel-pin.json release/runtime-wheel-pin.json release/runtime/*.whl; then
            echo "::error::release/wheel-pin.json, release/runtime-wheel-pin.json, or the embedded runtime wheel no longer match a fresh build from current source. Run 'python scripts/build_release.py' and commit the result." >&2
            exit 1
          fi

  compare-qualification-receipts:
    name: Compare frozen-wheel qualification receipts
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download platform qualification receipts
        uses: actions/download-artifact@v4
        with:
          pattern: release-qualification-*
          path: qualification-receipts
          merge-multiple: false

      - name: Require canonical qualification equivalence
        run: python scripts/compare_qualification_receipts.py qualification-receipts

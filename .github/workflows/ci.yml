name: package-core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ty check src/rob2_kit
      - run: uv run --frozen python -m rob2_kit.release_gate
      - run: uv run --frozen pytest
      - run: uv build --wheel

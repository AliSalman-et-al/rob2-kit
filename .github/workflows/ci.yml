name: Verify pinned repository for audit

on:
  push:
    branches: [audit/package-c2b88ee3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2b88ee3caa0201cdc1f67b33ac46c834148c796
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact locked dependencies
        run: uv sync --locked --all-groups --python 3.13
      - name: Run checks independently without changing sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/audit-verification"
          git rev-parse HEAD > "$RUNNER_TEMP/audit-verification/COMMIT.txt"
          uv run --no-sync python --version > "$RUNNER_TEMP/audit-verification/python.txt"
          uv run --no-sync ruff format --check src tests docs/release > "$RUNNER_TEMP/audit-verification/format.txt" 2>&1
          echo "format=$?" >> "$RUNNER_TEMP/audit-verification/exit-codes.txt"
          uv run --no-sync ruff check src tests docs/release > "$RUNNER_TEMP/audit-verification/lint.txt" 2>&1
          echo "lint=$?" >> "$RUNNER_TEMP/audit-verification/exit-codes.txt"
          uv run --no-sync ty check src tests docs/release > "$RUNNER_TEMP/audit-verification/types.txt" 2>&1
          echo "types=$?" >> "$RUNNER_TEMP/audit-verification/exit-codes.txt"
          uv run --no-sync pytest --junitxml="$RUNNER_TEMP/audit-verification/pytest.xml" > "$RUNNER_TEMP/audit-verification/pytest.txt" 2>&1
          echo "pytest=$?" >> "$RUNNER_TEMP/audit-verification/exit-codes.txt"
          cat "$RUNNER_TEMP/audit-verification/exit-codes.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rob2-audit-verification-c2b88ee3
          path: ${{ runner.temp }}/audit-verification/
          retention-days: 7
          if-no-files-found: error

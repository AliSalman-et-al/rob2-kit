name: Package pinned repository for audit

on:
  push:
    branches: [audit/package-c2b88ee3]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2b88ee3caa0201cdc1f67b33ac46c834148c796
          persist-credentials: false
          fetch-depth: 1
      - name: Archive the exact audited commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c2b88ee3caa0201cdc1f67b33ac46c834148c796
          mkdir -p "$RUNNER_TEMP/audit-package"
          git archive --format=zip --output="$RUNNER_TEMP/audit-package/rob2-kit-c2b88ee3.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/audit-package/COMMIT.txt"
          cd "$RUNNER_TEMP/audit-package"
          sha256sum rob2-kit-c2b88ee3.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rob2-audit-c2b88ee3
          path: ${{ runner.temp }}/audit-package/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

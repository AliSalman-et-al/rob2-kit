name: Lint hardening branch

on:
  push:
    branches:
      - refactor/optimize-rob2-kit-performance

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups --python "3.11"
      - run: uv run --no-sync ruff check --fix --unsafe-fixes src tests docs/release
      - run: uv run --no-sync ruff format src tests docs/release
      - name: Commit exact Ruff output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs/release
          git commit -m "Apply Ruff lint fixes"
          git push

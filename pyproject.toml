[project]
name = "rob2-kit"
version = "0.12.0"
description = "Evidence-grounded Cochrane RoB 2 risk-of-bias assessment for AI agents: an MCP server and skill"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ali Salman" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["risk of bias", "rob2", "cochrane", "systematic review", "mcp", "agent skills"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp==4.0.3",
    "httpx==0.28.1",
    "mcp==2.1.1",
    "pydantic==2.13.4",
    "pymupdf==1.28.2",
    "rapidfuzz>=3.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/AliSalman-et-al/rob2-kit"
Documentation = "https://github.com/AliSalman-et-al/rob2-kit/blob/main/docs/user-guide.md"
Issues = "https://github.com/AliSalman-et-al/rob2-kit/issues"

[project.scripts]
rob2 = "rob2_kit.interfaces.cli.app:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rob2_kit"]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "scripts"]
addopts = "-n 4"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/release/public-contract.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/rob2_kit/application/contracts.py" = ["E501"]
"src/rob2_kit/application/report.py" = ["E501"]

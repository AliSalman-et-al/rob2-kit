[project]
name = "rob2-kit"
version = "0.1.0"
description = "Host-neutral RoB 2 assessment engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "liteparse>=2.10.0",
    "mcp>=1.26.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.26.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "typer>=0.27.0",
]

[project.scripts]
rob2 = "rob2_kit.interfaces.cli.app:main"
rob2-mcp = "rob2_kit.interfaces.mcp.server:main"
rob2-build-adapters = "rob2_kit.release:main"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "hypothesis>=6.162.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rob2_kit"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "rob2_kit/packs"
"schemas" = "rob2_kit/schemas"
"skills" = "rob2_kit/skills"
"adapters" = "rob2_kit/adapters"
"docs" = "rob2_kit/docs"
"rob2.lock" = "rob2_kit/rob2.lock"
"release/runtime" = "rob2_kit/release/runtime"
"uv.lock" = "rob2_kit/uv.lock"
"release/runtime-wheel-pin.json" = "rob2_kit/release/runtime-wheel-pin.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

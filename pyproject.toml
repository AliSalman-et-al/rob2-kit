[project]
name = "rob2-kit"
version = "0.1.0"
description = "Model-free MCP boundary for RoB 2 assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp==3.2.4", "httpx==0.28.1", "pymupdf==1.27.1"]

[project.scripts]
rob2-mcp = "rob2_kit.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rob2_kit"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.3", "ty==0.0.71"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

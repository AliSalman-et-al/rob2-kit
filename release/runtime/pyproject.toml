[project]
name = "rob2-kit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "liteparse>=2.10.0",
    "mcp>=1.26.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.26.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "hypothesis>=6.162.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rob2_kit"]

[tool.uv]
package = true

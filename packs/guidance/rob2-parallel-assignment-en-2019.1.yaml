compatible_logic_hashes:
  - sha256:a729f2654bac2be10315463a450866d274ead7220d7524cf17838a175f96e3a0
evidence_targets:
  - "Use the randomized allocation, concealment, deviations, missingness, measurement, and selective-reporting evidence that bears on this exact Trial, Result, population, comparison, analysis, and time point."
  - "Prefer direct trial conduct and result-reporting statements; retain the relevant Source role, chronology, section, and locator."
counter_evidence:
  - "Actively seek a distinct contradiction pass for each signaling question, including later or companion Sources and result-bearing analyses."
  - "Record credible evidence against the leading interpretation rather than resolving disagreement by Source prestige or majority vote."
inference_boundaries:
  - "Inference must be grounded in the disclosed Trial and Result context; absence of a keyword, abstract-only mention, or generic methodological expectation is not evidence."
  - "Do not transfer conduct, populations, or analyses between Trials, Randomizations, Results, or time points merely because Sources cite one another."
no_information_rule: "Use No information only when the applicable question permits it, readable Sources and required search coverage are adequate, and neither direct evidence nor a reasonable probable inference supports an adjacent answer; operational search failure is a limitation, not No information."
recurring_traps:
  - "Do not treat a protocol promise, background statement, bibliography entry, or another-Trial Discussion passage as proof that the reported Result was obtained or analysed as described."
  - "Do not use journal prestige, named methods, arbitrary thresholds, or numeric Domain counts as a substitute for the Logic pack and question-specific evidence."
items:
  - logic_element_id: sq:randomization:sequence
    content_origin: official
    text: "Was the allocation sequence random?"
    affected_change: decision_relevant
  - logic_element_id: sq:randomization:concealment
    content_origin: official
    text: "Was the allocation sequence concealed until participants were enrolled and assigned to interventions?"
    affected_change: decision_relevant
  - logic_element_id: sq:randomization:baseline-imbalance
    content_origin: official
    text: "Did baseline differences between intervention groups suggest a problem with the randomization process?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:participants-aware
    content_origin: official
    text: "Were participants aware of their assigned intervention during the trial?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:personnel-aware
    content_origin: official
    text: "Were carers and people delivering the interventions aware of participants' assigned intervention during the trial?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:context-deviations
    content_origin: official
    text: "If applicable: Were there deviations from the intended intervention that arose because of the trial context?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:affected-outcome
    content_origin: official
    text: "If applicable: Were these deviations likely to have affected the outcome?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:balanced
    content_origin: official
    text: "If applicable: Were these deviations from intended intervention balanced between groups?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:appropriate-analysis
    content_origin: official
    text: "Was an appropriate analysis used to estimate the effect of assignment to intervention?"
    affected_change: decision_relevant
  - logic_element_id: sq:deviations:substantial-impact
    content_origin: official
    text: "If applicable: Was there potential for a substantial impact on the result of the failure to analyse participants in the group to which they were randomized?"
    affected_change: decision_relevant
  - logic_element_id: sq:missing:data-available
    content_origin: official
    text: "Were data for this outcome available for all, or nearly all, participants randomized?"
    affected_change: decision_relevant
  - logic_element_id: sq:missing:evidence-unbiased
    content_origin: official
    text: "If applicable: Is there evidence that the result was not biased by missing outcome data?"
    affected_change: decision_relevant
  - logic_element_id: sq:missing:true-value-dependent
    content_origin: official
    text: "If applicable: Could missingness in the outcome depend on its true value?"
    affected_change: decision_relevant
  - logic_element_id: sq:missing:likely-dependent
    content_origin: official
    text: "If applicable: Is it likely that missingness in the outcome depended on its true value?"
    affected_change: decision_relevant
  - logic_element_id: sq:measurement:method-inappropriate
    content_origin: official
    text: "Was the method of measuring the outcome inappropriate?"
    affected_change: decision_relevant
  - logic_element_id: sq:measurement:differential
    content_origin: official
    text: "Could measurement or ascertainment of the outcome have differed between intervention groups?"
    affected_change: decision_relevant
  - logic_element_id: sq:measurement:assessor-aware
    content_origin: official
    text: "If applicable: Were outcome assessors aware of the intervention received by study participants?"
    affected_change: decision_relevant
  - logic_element_id: sq:measurement:influence-possible
    content_origin: official
    text: "If applicable: Could assessment of the outcome have been influenced by knowledge of intervention received?"
    affected_change: decision_relevant
  - logic_element_id: sq:measurement:influence-likely
    content_origin: official
    text: "If applicable: Is it likely that assessment of the outcome was influenced by knowledge of intervention received?"
    affected_change: decision_relevant
  - logic_element_id: sq:selection:prespecified-analysis
    content_origin: official
    text: "Were the data that produced this result analysed in accordance with a pre-specified analysis plan finalized before unblinded outcome data were available?"
    affected_change: decision_relevant
  - logic_element_id: sq:selection:multiple-measurements
    content_origin: official
    text: "Is the numerical result likely to have been selected, on the basis of the results, from multiple eligible outcome measurements within the outcome domain?"
    affected_change: decision_relevant
  - logic_element_id: sq:selection:multiple-analyses
    content_origin: official
    text: "Is the numerical result likely to have been selected, on the basis of the results, from multiple eligible analyses of the data?"
    affected_change: decision_relevant
  - logic_element_id: input:combined-concerns
    content_origin: maintainer_authored
    text: "When no Domain is High and multiple Domains have Some concerns, state whether those concerns together substantially lower confidence in the Result."
    affected_change: decision_relevant
    provenance_refs: [provenance:rob2-kit-guidance]
    evidence_targets:
      - "Use the frozen Domain judgments and their question-specific Evidence Bundles; do not count Domains as a proxy for combined impact."
    counter_evidence:
      - "Consider whether the concerns are overlapping, minor, or otherwise unlikely to substantially lower confidence together."
    inference_boundaries:
      - "This is an attributable assessor input, not a model confidence score or an automatic numeric threshold."
    no_information_rule: "Do not substitute No information for this boolean input; surface unresolved evidence as a diagnostic condition before answering."
    recurring_traps:
      - "A second Some-concerns Domain does not itself imply High; the assessor must provide the structured combined-concerns answer."

schema_version: 1.0.0
required_schema_version: 1.0.0
family_id: logic:rob2-parallel-assignment
release_id: "2019.1"
authors: [RoB 2 Kit maintainers]
content_hash: sha256:222b3d2e1ef923a0fde8b64e3de5a5aa845ecf7e36c58c6936d01ae143eb09c7
instrument: rob2
trial_design: individually_randomized_parallel_group
effect_of_interest: assignment
allowed_answers: [yes, probably_yes, probably_no, no, no_information]

# IDs express permanent semantics, never display numbers or wording.
questions:
  - id: sq:randomization:sequence
  - id: sq:randomization:concealment
  - id: sq:randomization:baseline-imbalance
  - id: sq:deviations:participants-aware
  - id: sq:deviations:personnel-aware
  - id: sq:deviations:context-deviations
    active_if:
      op: any
      conditions:
        - {op: answer_in, question_id: sq:deviations:participants-aware, answers: [yes, probably_yes, no_information]}
        - {op: answer_in, question_id: sq:deviations:personnel-aware, answers: [yes, probably_yes, no_information]}
  - id: sq:deviations:affected-outcome
    active_if: {op: answer_in, question_id: sq:deviations:context-deviations, answers: [yes, probably_yes]}
  - id: sq:deviations:balanced
    active_if: {op: answer_in, question_id: sq:deviations:affected-outcome, answers: [yes, probably_yes, no_information]}
  - id: sq:deviations:appropriate-analysis
  - id: sq:deviations:substantial-impact
    active_if: {op: answer_in, question_id: sq:deviations:appropriate-analysis, answers: [probably_no, no, no_information]}
  - id: sq:missing:data-available
  - id: sq:missing:evidence-unbiased
    active_if: {op: answer_in, question_id: sq:missing:data-available, answers: [probably_no, no, no_information]}
  - id: sq:missing:true-value-dependent
    active_if: {op: answer_in, question_id: sq:missing:evidence-unbiased, answers: [probably_no, no]}
  - id: sq:missing:likely-dependent
    active_if: {op: answer_in, question_id: sq:missing:true-value-dependent, answers: [yes, probably_yes, no_information]}
  - id: sq:measurement:method-inappropriate
  - id: sq:measurement:differential
  - id: sq:measurement:assessor-aware
    active_if:
      op: all
      conditions:
        - {op: answer_in, question_id: sq:measurement:method-inappropriate, answers: [probably_no, no, no_information]}
        - {op: answer_in, question_id: sq:measurement:differential, answers: [probably_no, no, no_information]}
  - id: sq:measurement:influence-possible
    active_if: {op: answer_in, question_id: sq:measurement:assessor-aware, answers: [yes, probably_yes, no_information]}
  - id: sq:measurement:influence-likely
    active_if: {op: answer_in, question_id: sq:measurement:influence-possible, answers: [yes, probably_yes, no_information]}
  - id: sq:selection:prespecified-analysis
  - id: sq:selection:multiple-measurements
  - id: sq:selection:multiple-analyses

domains:
  - id: domain:randomization
    question_ids:
      - sq:randomization:sequence
      - sq:randomization:concealment
      - sq:randomization:baseline-imbalance
    judgment_rules:
      - id: rule:randomization:concealment-failed
        when: {op: answer_in, question_id: sq:randomization:concealment, answers: [probably_no, no]}
        judgment: high
      - id: rule:randomization:unknown-concealment-and-imbalance
        when:
          op: all
          conditions:
            - {op: answer_in, question_id: sq:randomization:concealment, answers: [no_information]}
            - {op: answer_in, question_id: sq:randomization:baseline-imbalance, answers: [yes, probably_yes]}
        judgment: high
      - id: rule:randomization:some-concerns
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:randomization:sequence, answers: [probably_no, no]}
            - {op: answer_in, question_id: sq:randomization:concealment, answers: [no_information]}
            - {op: answer_in, question_id: sq:randomization:baseline-imbalance, answers: [yes, probably_yes]}
        judgment: some_concerns
      - id: rule:randomization:low
        when: {op: answer_in, question_id: sq:randomization:sequence, answers: [yes, probably_yes, no_information]}
        judgment: low

  - id: domain:deviations
    question_ids:
      - sq:deviations:participants-aware
      - sq:deviations:personnel-aware
      - sq:deviations:context-deviations
      - sq:deviations:affected-outcome
      - sq:deviations:balanced
      - sq:deviations:appropriate-analysis
      - sq:deviations:substantial-impact
    judgment_rules:
      - id: rule:deviations:unbalanced-impact
        when:
          op: all
          conditions:
            - {op: answer_in, question_id: sq:deviations:context-deviations, answers: [yes, probably_yes]}
            - {op: answer_in, question_id: sq:deviations:affected-outcome, answers: [yes, probably_yes, no_information]}
            - {op: answer_in, question_id: sq:deviations:balanced, answers: [probably_no, no, no_information]}
        judgment: high
      - id: rule:deviations:analysis-substantial-impact
        when:
          op: all
          conditions:
            - {op: answer_in, question_id: sq:deviations:appropriate-analysis, answers: [probably_no, no, no_information]}
            - {op: answer_in, question_id: sq:deviations:substantial-impact, answers: [yes, probably_yes, no_information]}
        judgment: high
      - id: rule:deviations:some-concerns
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:deviations:context-deviations, answers: [no_information]}
            - {op: answer_in, question_id: sq:deviations:affected-outcome, answers: [probably_no, no]}
            - {op: answer_in, question_id: sq:deviations:balanced, answers: [yes, probably_yes]}
            - {op: answer_in, question_id: sq:deviations:substantial-impact, answers: [probably_no, no]}
        judgment: some_concerns
      - id: rule:deviations:low
        when: {op: answer_in, question_id: sq:deviations:appropriate-analysis, answers: [yes, probably_yes]}
        judgment: low

  - id: domain:missing
    question_ids:
      - sq:missing:data-available
      - sq:missing:evidence-unbiased
      - sq:missing:true-value-dependent
      - sq:missing:likely-dependent
    judgment_rules:
      - id: rule:missing:data-complete
        when: {op: answer_in, question_id: sq:missing:data-available, answers: [yes, probably_yes]}
        judgment: low
      - id: rule:missing:evidence-unbiased
        when: {op: answer_in, question_id: sq:missing:evidence-unbiased, answers: [yes, probably_yes]}
        judgment: low
      - id: rule:missing:not-dependent
        when: {op: answer_in, question_id: sq:missing:true-value-dependent, answers: [probably_no, no]}
        judgment: low
      - id: rule:missing:likely-dependent
        when: {op: answer_in, question_id: sq:missing:likely-dependent, answers: [yes, probably_yes, no_information]}
        judgment: high
      - id: rule:missing:some-concerns
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:missing:evidence-unbiased, answers: [no_information]}
            - {op: answer_in, question_id: sq:missing:likely-dependent, answers: [probably_no, no]}
        judgment: some_concerns

  - id: domain:measurement
    question_ids:
      - sq:measurement:method-inappropriate
      - sq:measurement:differential
      - sq:measurement:assessor-aware
      - sq:measurement:influence-possible
      - sq:measurement:influence-likely
    judgment_rules:
      - id: rule:measurement:inappropriate-or-differential
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:measurement:method-inappropriate, answers: [yes, probably_yes]}
            - {op: answer_in, question_id: sq:measurement:differential, answers: [yes, probably_yes]}
        judgment: high
      - id: rule:measurement:likely-influenced
        when: {op: answer_in, question_id: sq:measurement:influence-likely, answers: [yes, probably_yes, no_information]}
        judgment: high
      - id: rule:measurement:some-concerns
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:measurement:method-inappropriate, answers: [no_information]}
            - {op: answer_in, question_id: sq:measurement:differential, answers: [no_information]}
            - {op: answer_in, question_id: sq:measurement:assessor-aware, answers: [no_information]}
            - {op: answer_in, question_id: sq:measurement:influence-likely, answers: [probably_no, no]}
        judgment: some_concerns
      - id: rule:measurement:low
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:measurement:assessor-aware, answers: [probably_no, no]}
            - {op: answer_in, question_id: sq:measurement:influence-possible, answers: [probably_no, no]}
        judgment: low

  - id: domain:selection
    question_ids:
      - sq:selection:prespecified-analysis
      - sq:selection:multiple-measurements
      - sq:selection:multiple-analyses
    judgment_rules:
      - id: rule:selection:selective-choice
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:selection:multiple-measurements, answers: [yes, probably_yes]}
            - {op: answer_in, question_id: sq:selection:multiple-analyses, answers: [yes, probably_yes]}
        judgment: high
      - id: rule:selection:some-concerns
        when:
          op: any
          conditions:
            - {op: answer_in, question_id: sq:selection:prespecified-analysis, answers: [probably_no, no, no_information]}
            - {op: answer_in, question_id: sq:selection:multiple-measurements, answers: [no_information]}
            - {op: answer_in, question_id: sq:selection:multiple-analyses, answers: [no_information]}
        judgment: some_concerns
      - id: rule:selection:low
        when:
          op: all
          conditions:
            - {op: answer_in, question_id: sq:selection:prespecified-analysis, answers: [yes, probably_yes]}
            - {op: answer_in, question_id: sq:selection:multiple-measurements, answers: [probably_no, no]}
            - {op: answer_in, question_id: sq:selection:multiple-analyses, answers: [probably_no, no]}
        judgment: low

assessor_inputs: []

overall_rules:
  - id: rule:overall:any-high
    when: {op: domain_any, judgments: [high]}
    judgment: high
  - id: rule:overall:any-concerns
    when: {op: domain_any, judgments: [some_concerns]}
    judgment: some_concerns
  - id: rule:overall:all-low
    when: {op: domain_all, judgments: [low]}
    judgment: low

inventory:
  - sq:randomization:sequence
  - sq:randomization:concealment
  - sq:randomization:baseline-imbalance
  - sq:deviations:participants-aware
  - sq:deviations:personnel-aware
  - sq:deviations:context-deviations
  - sq:deviations:affected-outcome
  - sq:deviations:balanced
  - sq:deviations:appropriate-analysis
  - sq:deviations:substantial-impact
  - sq:missing:data-available
  - sq:missing:evidence-unbiased
  - sq:missing:true-value-dependent
  - sq:missing:likely-dependent
  - sq:measurement:method-inappropriate
  - sq:measurement:differential
  - sq:measurement:assessor-aware
  - sq:measurement:influence-possible
  - sq:measurement:influence-likely
  - sq:selection:prespecified-analysis
  - sq:selection:multiple-measurements
  - sq:selection:multiple-analyses
  - domain:randomization
  - domain:deviations
  - domain:missing
  - domain:measurement
  - domain:selection
  - rule:randomization:concealment-failed
  - rule:randomization:unknown-concealment-and-imbalance
  - rule:randomization:some-concerns
  - rule:randomization:low
  - rule:deviations:unbalanced-impact
  - rule:deviations:analysis-substantial-impact
  - rule:deviations:some-concerns
  - rule:deviations:low
  - rule:missing:data-complete
  - rule:missing:evidence-unbiased
  - rule:missing:not-dependent
  - rule:missing:likely-dependent
  - rule:missing:some-concerns
  - rule:measurement:inappropriate-or-differential
  - rule:measurement:likely-influenced
  - rule:measurement:some-concerns
  - rule:measurement:low
  - rule:selection:selective-choice
  - rule:selection:some-concerns
  - rule:selection:low
  - rule:overall:any-high
  - rule:overall:any-concerns
  - rule:overall:all-low

